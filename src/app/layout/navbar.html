    <header role="banner" class="relative bg-[#008001]">
      <div class="mx-auto w-full max-w-[770px] px-0 sm:px-2">
        <!-- Classic Header Image (do not upscale beyond intrinsic width) -->
        <a
          routerLink="/"
          class="block focus:outline-none focus-visible:ring-2 focus-visible:ring-club-lime"
          aria-label="The Three Hundred Club - Home"
        >
          <img
            ngSrc="header-logo.jpg"
            alt="The Three Hundred Club"
            width="770"
            height="70"
            priority
            class="block w-full h-auto object-contain"
          />
        </a>
      </div>

      <!-- Menu Button (pinned to the window edge) -->
      <button
        type="button"
        (click)="openDrawer()"
        class="absolute top-1/2 right-2 -translate-y-1/2
               flex items-center justify-center w-10 h-10 rounded-md
               bg-black/25 dark:bg-gray-800/90 text-white shadow-lg backdrop-blur-sm
               border border-white/20 dark:border-white/10
               hover:bg-black/35 dark:hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-club-lime
               transition-colors"
        aria-label="Open menu"
        [attr.aria-expanded]="isDrawerOpen()"
        aria-haspopup="dialog"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </header>

    <!-- Side Drawer -->
    @if (isDrawerOpen()) {
      <app-side-drawer (close)="closeDrawer()" />
    }
